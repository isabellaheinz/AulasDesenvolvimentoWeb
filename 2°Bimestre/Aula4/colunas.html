<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coluna</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 80%;
            margin: 0 auto;
        }


        .page {
            background-color: aliceblue;
            overflow: auto;
            
        }

        .coluna1 {
            border: 2px solid black;
            width: 25%;
            height: 100vh;
            float: left;
            
        }

        .colunaCentral {
            border: 2px solid black;
            width: 48%;
            height: 100vh;
            float: left;
            margin-left: 1%;
        }

        .coluna2{
            border: 2px solid black;
            width: 25%;
            height: 100vh;
            float: right;
        }



    </style>
</head>
<body>
    <div class="page">
        <div class="coluna1">Coluna 1</div>
        <div class="colunaCentral">Coluna Central</div>
        <div class="coluna2">Coluna 2</div>

    </div>
</body>
</html>
