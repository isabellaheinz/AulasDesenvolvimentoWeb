<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Bem Vindo <span> </span></h2> 
    <div></div>

    <script>

        const espacoNome = document.querySelector('span');
        const espacoPais = document.querySelector('div');

        fetch("https://randomuser.me/api/")
        .then(resposta => resposta.json())
       /*  .then(resposta => {
            console.log(resposta)
        }) */
        .then(dados => {
            console.log(dados['results'][0].name.first);
            const nome = dados['results'][0].name;
            espacoNome.innerText = nome.title + ' ' + nome.first + ' ' + nome.last;

            const pais = dados['results'][0].location.country;
            espacoPais.innerText = pais;
        })
        .catch(erro => {
            console.log("Deu erro")
        })
        

    </script>
    
</body>
</html>
