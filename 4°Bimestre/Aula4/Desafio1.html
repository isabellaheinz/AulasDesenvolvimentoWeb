<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desafio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>

        body {
            color: white;
        }
        .container {
            background-color: black;
        }


        [class*="col"]{
            border: 2px solid pink;
            padding: 20px;
        }
        
    </style>
</head>

<body>
    
    <div class="container mt-5">
        <h1>Container</h1>
        <div class="row">
            <div class="col-6 col-md-3">Col-1</div>
            <div class="col-6 col-md-3">Col-2</div>
            <div class="col-6 col-md-3">Col-3</div>
            <div class="col-6 col-md-3">Col-4</div>
        </div>                 
        <div class="row">
            <div class="col-4">Col-1</div>
            <div class="col-4">Col-2</div>
            <div class="col-4">Col-3</div>
        </div>
        <div class="row">
            <div class="col-6">Col-1</div>
            <div class="col-6">Col-2</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
