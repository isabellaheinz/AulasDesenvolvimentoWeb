<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9</title>

    <style>

        body {
            background-color: white;
            transition: all 0.3s;
        }

        body.escuro {
            background-color: black;
        }

        body.escuro #mensagem {
            color: white;
        }

        body.escuro input {
            background-color: rgba(128, 128, 128, 0.384);
            color: white;
        }

        body.escuro button {
            background-color: rgba(128, 128, 128, 0.384);
            color: white;
        }

        .container {
            gap: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 15%;
            padding: 10px;
        }

        button {
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid rgba(128, 128, 128, 0.199);
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199);
            transition: all 0.3s;
        }


        .container input {
            width: 300px;
            height: 40px;
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid rgba(128, 128, 128, 0.199);
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199);
            transition: all 0.5s;
        }

        #mensagem {
            transition: all 0.5s;
        }

        .sucesso {
            background-color: green;
            color: white;
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199);
        }

        .erro {
            background-color: red;
            color: white;
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199);
        }
    </style>
</head>
<body>

    <div class="container">
        <button>Modo escuro</button>
        <input type="text" value="" required="true" placeholder="Informe seu texto">
        <div id="mensagem"></div>
    </div>

    <script>
        const campoTexto = document.querySelector("input");
        const mensagem = document.querySelector("#mensagem");
        const botao = document.querySelector('button');

        campoTexto.addEventListener("input", () => {
            
            let digitado = campoTexto.value
            mensagem.classList.remove("erro")
            mensagem.classList.remove("sucesso")


            if(digitado.length > 3) {
                
                if(digitado == "chocolate"){
                    mensagem.innerText = "Meu sabor de sorvete favorito!!";
                    mensagem.classList.add("sucesso");
                } else if(digitado == "flocos") {
                    mensagem.innerText = "Flocos é bom demais!!";
                    mensagem.classList.add("sucesso");
                } else {
                    mensagem.innerText = "Ahh, eu esperava um sabor de sorvete...";
                    mensagem.classList.add("erro");
                }

            } else {
                mensagem.innerText = "Insira um texto maior que 3 caracteres.";
            }
            
        })

        let contador = 1;

        botao.addEventListener('click', () => {
            
            document.body.classList.toggle("escuro");
            //Pesquisei propriedades que poderia usar, e esta pareceu ser a mais recomendada. Ao clicar, se o body não tiver a classe escuro, ela adiciona, e se ele ja estiver, ela remove.

            if(contador == 1){
                botao.innerText = "Modo Claro";
                contador++;
            } else if (contador == 2){
                botao.innerText = "Modo Escuro";
                contador--
            }
            
        })
    </script>
</body>
</html>
