<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6</title>

    <style>

        .container {
            margin-top: 15%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid rgba(128, 128, 128, 0.199);
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199)
        }
    </style>
</head>
<body>

    <div class="container">
        <button>Gerar nome de uma fantasia aleatória</button>
        <h1>Fantasia Gerada</h1>
    </div>
   

    <script>
        const botao = document.querySelector("button");
        const titulo = document.querySelector('h1');
        const acao = ["O amor ", "A sombra ", "O inimigo ", "O Monstro ", "A viagem "];
        const lugar = ["no calabouço ", "na prisão ", "na floresta encantada ", "na academia de vilões "];
        const complemento = ["de verão.", "de inverno.", "de primaveira.", "de outono."];

        function sortearNumero(array){
            let numAleatorio = Math.floor(Math.random() * array.length);
            return numAleatorio;
        }

        botao.addEventListener('click', () => {
            let acaoSorteada = acao[sortearNumero(acao)];
            let lugarSorteado = lugar[sortearNumero(lugar)];
            let complementoSorteado = complemento[sortearNumero(complemento)];

            titulo.innerText = acaoSorteada + lugarSorteado + complementoSorteado;
        })

    </script>

</body>
</html>
