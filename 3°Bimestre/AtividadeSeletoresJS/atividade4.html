<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>

    <style>

        .container {
            margin-top: 15%;
            margin-left: 40%;
            width: 20%;
            height: 200px;
            border: 2px solid rgba(128, 128, 128, 0.199);
            box-shadow: 0px 0px 8px  rgba(128, 128, 128, 0.199) ;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #clique, #zerar{
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid rgba(128, 128, 128, 0.199);
            box-shadow: 0px 0px 4px  rgba(128, 128, 128, 0.199)
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="clique">Clique Aqui</button>
        <h1 id="contador">0</h1>
        <button id="zerar">Zerar Contador</button>
    </div>

    
    <script>
        const botao = document.querySelector("#clique")
        const botaoZerar = document.querySelector("#zerar")
        let contador = document.querySelector("#contador")
        let cont = 0;

        botao.addEventListener("click", () => {
            cont += 1;
            contador.innerText = cont;
        })

        botaoZerar.addEventListener("click", () => {
            cont = 0;
            contador.innerText = cont;
        })
    </script>
    
</body>
</html>
