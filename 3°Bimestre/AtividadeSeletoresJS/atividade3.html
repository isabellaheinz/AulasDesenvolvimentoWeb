<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Titulo Inicial</h1>
    
    <script>

        let titulo = document.querySelector("#titulo")
        const numAleatorio = Math.random(30, 100) * (100 - 30) + 30;

        titulo.style.color = "pink";
        titulo.innerText = "Texto Mudado";
        titulo.style.fontSize = numAleatorio + 'px';
        
    </script>
</body>
</html>
